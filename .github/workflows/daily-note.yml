name: 每日 Field Note

on:
  schedule:
    - cron: '30 0 * * *'   # 台北 08:30 每天一篇
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只試跑不發佈'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-note
  cancel-in-progress: false

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: 裝相依
        run: pip install --quiet Pillow

      - name: 抓 speak-tw(語感閘門)
        run: git clone --depth 1 https://github.com/yazelin/speak-tw.git /tmp/speak-tw

      - name: 確認金鑰
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODEX_IMAGE_KEY: ${{ secrets.CODEX_IMAGE_KEY }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "::error::缺 GEMINI_API_KEY secret"; exit 1; }
          case "$GEMINI_API_KEY" in gmw_*) ;; *) echo "::error::GEMINI_API_KEY 應是 gmw_ 開頭的 gemini-web consumer key"; exit 1;; esac
          [ -n "$CODEX_IMAGE_KEY" ] || echo "::warning::缺 CODEX_IMAGE_KEY,今天的筆記會沒圖"
          case "${CODEX_IMAGE_KEY:-cimg_}" in cimg_*) ;; *) echo "::error::CODEX_IMAGE_KEY 應是 cimg_ 開頭的 bearer token,不是 key_ 開頭的 handle"; exit 1;; esac

      - name: 產出今日筆記
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODEX_IMAGE_KEY: ${{ secrets.CODEX_IMAGE_KEY }}
          SPEAK_TW: /tmp/speak-tw/bin/speak-tw
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python scripts/daily_note.py

      - name: 發佈
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Mori"
          git config user.email "mori-field-notes@users.noreply.github.com"
          git add docs state.json
          git diff --cached --quiet && { echo "沒有變更"; exit 0; }
          TITLE=$(python3 -c "import json;print(json.load(open('docs/notes.json'))[0]['title'])")
          git commit -m "note: ${TITLE}"
          git push
